<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>人机对话 · 动态交互 HTML 演示（AI 生成文本）</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; margin: 0; padding: 16px 20px; color: #333; background: #fff; }
  @media (prefers-color-scheme: dark) { body { color: #ddd; background: #1a1a1a; } }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .sub { font-size: 12px; color: #888; margin: 0 0 12px; }
  .chat { border: 1px solid #ddd; border-radius: 10px; min-height: 220px; max-height: 320px; overflow-y: auto; padding: 12px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
  @media (prefers-color-scheme: dark) { .chat { border-color: #333; } }
  .msg { max-width: 82%; padding: 8px 12px; border-radius: 10px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
  .me { align-self: flex-end; background: #3b82f6; color: #fff; border-bottom-right-radius: 2px; }
  .ai { align-self: flex-start; background: #f1f5f9; color: #333; border-bottom-left-radius: 2px; }
  @media (prefers-color-scheme: dark) { .ai { background: #2a2a2a; color: #ddd; } }
  .sys { align-self: center; font-size: 11px; color: #999; }
  .row { display: flex; gap: 8px; }
  input { flex: 1; padding: 9px 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 13px; background: #fff; color: #333; }
  @media (prefers-color-scheme: dark) { input { background: #222; border-color: #444; color: #ddd; } }
  button { padding: 8px 16px; border-radius: 8px; border: 1px solid #ccc; background: #f5f5f5; cursor: pointer; font-size: 13px; }
  button.primary { background: #3b82f6; border-color: #3b82f6; color: #fff; }
  button.primary:hover { background: #2563eb; }
  button:disabled { opacity: 0.6; cursor: default; }
  .muted { color: #888; font-size: 12px; margin-top: 10px; line-height: 1.7; }
  .img { max-width: 120px; border-radius: 8px; border: 1px solid #ddd; }
</style>
</head>
<body>
  <h1>💬 人机对话（动态交互 HTML 演示）</h1>
  <p class="sub">模拟与「客户」对话：AI 生成文本在<b>子对话</b>中使用（前端自行维护 context json）；下方的「发送图片」走的是<b>添加图片到评判上下文</b>埋点——本组件配置为非多模态模型，发送图片会触发右上角提示。</p>

  <div class="chat" id="chat"></div>
  <div class="row">
    <input id="input" placeholder="输入给客户说的话，按回车发送…" />
    <button id="send" class="primary">发送</button>
    <button id="imgBtn">📷 发送图片</button>
    <input type="file" id="imgFile" accept="image/*" style="display:none" />
  </div>

  <p class="muted">💡 对话历史由本页面自己维护成一个 context json（[{role, content}, …]），随每次「AI 生成文本」请求一起发给父页面；它<b>不</b>进入最终评判上下文（评判只使用「添加文本/图片到评判上下文」两个埋点收集的内容）。点击右下角「结束并提交给 AI 评判」可以把本组件加入评判上下文的内容交给 AI 评判。</p>

<script>
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    var chat = $("chat");
    var history = []; // 前端自行维护的子对话 context json
    var busy = false;

    function addMsg(role, text) {
      var div = document.createElement("div");
      div.className = "msg " + (role === "me" ? "me" : "ai");
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }
    function addImg(dataUrl) {
      var div = document.createElement("div");
      div.className = "msg ai";
      var img = document.createElement("img");
      img.className = "img";
      img.src = dataUrl;
      div.appendChild(img);
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }
    function send() {
      var input = $("input");
      var text = input.value.trim();
      if (!text || busy) return;
      input.value = "";
      addMsg("me", text);
      history.push({ role: "user", content: text });
      busy = true;
      $("send").disabled = true;
      addMsg("ai", "对方正在输入……");
      var requestId = "chat-" + Date.now();
      window.parent.postMessage({
        type: "metapilot:generate:text",
        requestId: requestId,
        prompt: text,
        context: history.map(function (h) { return h.role + "：" + h.content; })
      }, "*");
    }
    window.addEventListener("message", function (e) {
      var d = e.data;
      if (!d || d.type !== "metapilot:generate:result") return;
      chat.removeChild(chat.lastChild); // 移除“对方正在输入……”
      if (d.ok) {
        addMsg("ai", d.text);
        history.push({ role: "assistant", content: d.text });
      } else {
        addMsg("ai", "（生成失败：" + (d.error || "未知错误") + "）");
      }
      busy = false;
      $("send").disabled = false;
    });
    $("send").onclick = send;
    $("input").addEventListener("keydown", function (e) { if (e.key === "Enter") send(); });

    // 发送图片：走「添加图片到评判上下文」埋点；multimodal=false 时父页面会 toast 提示
    $("imgBtn").onclick = function () { $("imgFile").click(); };
    $("imgFile").onchange = function () {
      var f = $("imgFile").files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () {
        addImg(String(reader.result));
        window.parent.postMessage({ type: "metapilot:context:image", dataUrl: String(reader.result) }, "*");
        $("imgFile").value = "";
      };
      reader.readAsDataURL(f);
    };

    addMsg("sys", "👋 对话已开始（本演示不自动开场，直接输入吧）");
  })();
</script>
</body>
</html>
