<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>知识大闯关 · 动态交互 HTML 演示</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; margin: 0; padding: 16px 20px; color: #333; background: #fff; }
  @media (prefers-color-scheme: dark) { body { color: #ddd; background: #1a1a1a; } }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .sub { font-size: 12px; color: #888; margin: 0 0 12px; }
  .bar { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; background: #f5f5f5; border: 1px solid #eee; border-radius: 10px; padding: 8px 14px; margin-bottom: 14px; font-size: 13px; }
  @media (prefers-color-scheme: dark) { .bar { background: #222; border-color: #333; } }
  .hp { color: #ef4444; font-weight: 600; }
  .kill { color: #3b82f6; font-weight: 600; }
  .level { color: #8b5cf6; font-weight: 600; }
  .card { border: 1px solid #ddd; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  @media (prefers-color-scheme: dark) { .card { border-color: #333; } }
  .q { font-size: 14px; margin: 0 0 10px; line-height: 1.6; }
  .opt { display: block; width: 100%; text-align: left; padding: 9px 12px; margin: 6px 0; border-radius: 8px; border: 1px solid #ccc; background: #fafafa; cursor: pointer; font-size: 13px; }
  @media (prefers-color-scheme: dark) { .opt { background: #222; border-color: #444; } }
  .opt:hover { border-color: #3b82f6; }
  .opt:disabled { opacity: 0.6; cursor: default; }
  .opt.ok { border-color: #22c55e; background: #ecfdf5; color: #15803d; }
  .opt.bad { border-color: #ef4444; background: #fef2f2; color: #b91c1c; }
  @media (prefers-color-scheme: dark) { .opt.ok { background: #0f2a1c; color: #4ade80; } .opt.bad { background: #2a1212; color: #f87171; } }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  button { padding: 7px 14px; border-radius: 8px; border: 1px solid #ccc; background: #f5f5f5; cursor: pointer; font-size: 13px; }
  button:hover { background: #e8e8e8; }
  button.primary { background: #3b82f6; border-color: #3b82f6; color: #fff; }
  button.primary:hover { background: #2563eb; }
  button:disabled { opacity: 0.6; cursor: default; }
  .ai { margin-top: 10px; border: 1px dashed #8b5cf6; border-radius: 8px; padding: 8px 12px; font-size: 12px; color: #6d28d9; background: #faf5ff; white-space: pre-wrap; line-height: 1.6; }
  @media (prefers-color-scheme: dark) { .ai { background: #1d1429; color: #c4b5fd; } }
  .end { text-align: center; padding: 18px 0 4px; font-size: 14px; }
  .end .big { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .muted { color: #888; font-size: 12px; margin-top: 10px; line-height: 1.7; }
  .toast-demo { margin-top: 6px; }
</style>
</head>
<body>
  <h1>⚔️ 知识大闯关（动态交互 HTML 演示）</h1>
  <p class="sub">题目就是敌人，选择正确行动就是击杀敌人；每一次击杀 / 通关 / 失败都会写入「评判上下文」，最后交给 AI 评判。</p>

  <div class="bar">
    <span class="hp">❤️ 生命 <span id="hp">3</span></span>
    <span class="kill">⚔️ 击杀 <span id="kills">0</span></span>
    <span class="level">🗺️ 关卡 <span id="level">1</span> / 3</span>
  </div>

  <div class="card" id="card">
    <p class="q" id="question"></p>
    <div id="options"></div>
    <div class="btnrow">
      <button id="hintBtn" class="primary">🤖 向 AI 求助（AI 生成文本）</button>
      <button id="shotBtn">📷 上传截图给评判（添加图片）</button>
      <input type="file" id="shotFile" accept="image/*" style="display:none" />
    </div>
    <div class="ai" id="aiBox" style="display:none"></div>
  </div>

  <div class="end" id="endBox" style="display:none">
    <div class="big" id="endTitle"></div>
    <p id="endDesc"></p>
  </div>

  <p class="muted">💡 本组件用到了 4 个前端埋点接口：添加文本到评判上下文（杀敌/通关/失败）、添加图片到评判上下文（上传截图）、AI 生成文本（求助）、结束并提交给 AI 评判（点击组件右下角的「结束并提交给 AI 评判」按钮，即使本页没有调用该接口也可以手动结束）。</p>

<script>
  (function () {
    var LEVELS = [
      { q: "采样定理要求采样频率至少为信号最高频率的（  ）倍。", opts: ["1 倍", "2 倍", "4 倍"], ok: 1, name: "采样定理" },
      { q: "一幅 8 位灰度图像共有多少个灰度级？", opts: ["128", "256", "512"], ok: 1, name: "灰度级" },
      { q: "图像卷积操作中，常用的 3×3 卷积核共包含多少个权重？", opts: ["3 个", "6 个", "9 个"], ok: 2, name: "卷积核" }
    ];
    var hp = 3, kills = 0, idx = 0, ended = false, aiBusy = false;
    var $ = function (id) { return document.getElementById(id); };

    function ctxText(text) {
      window.parent.postMessage({ type: "metapilot:context:text", text: text }, "*");
    }
    function ctxImage(dataUrl) {
      window.parent.postMessage({ type: "metapilot:context:image", dataUrl: dataUrl }, "*");
    }
    function render() {
      $("hp").textContent = hp;
      $("kills").textContent = kills;
      $("level").textContent = Math.min(idx + 1, LEVELS.length);
      if (ended) return;
      var lv = LEVELS[idx];
      $("question").textContent = "第 " + (idx + 1) + " 关 · " + lv.name + "：" + lv.q;
      var box = $("options");
      box.innerHTML = "";
      lv.opts.forEach(function (opt, i) {
        var b = document.createElement("button");
        b.className = "opt";
        b.textContent = String.fromCharCode(65 + i) + ". " + opt;
        b.onclick = function () { choose(i, b); };
        box.appendChild(b);
      });
    }
    function choose(i, btn) {
      if (ended) return;
      var lv = LEVELS[idx];
      var all = $("options").querySelectorAll(".opt");
      all.forEach(function (b) { b.disabled = true; });
      if (i === lv.ok) {
        btn.classList.add("ok");
        kills++;
        ctxText("系统：用户击杀敌人（第" + (idx + 1) + "关：" + lv.name + "，回答正确）");
        setTimeout(function () {
          idx++;
          if (idx >= LEVELS.length) { win(); return; }
          render();
        }, 700);
      } else {
        btn.classList.add("bad");
        hp--;
        ctxText("系统：用户在" + (idx + 1) + "关（" + lv.name + "）答错，损失 1 点生命");
        setTimeout(function () {
          if (hp <= 0) { lose(); return; }
          render();
        }, 700);
      }
      $("hp").textContent = hp;
      $("kills").textContent = kills;
    }
    function win() {
      ended = true;
      ctxText("系统：用户已通过全部关卡（共击杀 " + kills + " 个敌人）");
      $("endTitle").textContent = "🎉 通关成功！";
      $("endDesc").textContent = "你击杀了全部敌人并通过了所有关卡。现在可以点击右下角「结束并提交给 AI 评判」，AI 会根据情景设定与击杀记录生成评判结果页。";
      $("endBox").style.display = "block";
      $("card").style.opacity = "0.5";
    }
    function lose() {
      ended = true;
      ctxText("系统：主角被击杀，游戏失败（击杀数 " + kills + "）");
      $("endTitle").textContent = "💀 游戏失败";
      $("endDesc").textContent = "生命耗尽，主角被击杀。你可以点击右下角「结束并提交给 AI 评判」，让 AI 根据本次闯关过程给出评判与建议。";
      $("endBox").style.display = "block";
      $("card").style.opacity = "0.5";
    }

    // AI 求助：调用「AI 生成文本」埋点（前端自行维护 prompt，父页面异步回传结果）
    $("hintBtn").onclick = function () {
      if (aiBusy || ended) return;
      var lv = LEVELS[idx];
      aiBusy = true;
      $("hintBtn").disabled = true;
      $("aiBox").style.display = "block";
      $("aiBox").textContent = "AI 思考中……";
      var requestId = "req-" + Date.now();
      window.parent.postMessage({
        type: "metapilot:generate:text",
        requestId: requestId,
        prompt: "我在玩一个知识大闯关游戏，当前第 " + (idx + 1) + " 关题目是：" + lv.q + "，选项：" + lv.opts.join("，") + "。请只给我一个提示（不要直接给出答案），100 字以内。"
      }, "*");
    };
    // 监听父页面回传的 AI 生成结果
    window.addEventListener("message", function (e) {
      var d = e.data;
      if (d && d.type === "metapilot:generate:result") {
        $("aiBox").style.display = "block";
        if (d.ok) { $("aiBox").textContent = "🤖 " + d.text; }
        else { $("aiBox").textContent = "🤖 AI 求助失败：" + (d.error || "未知错误"); }
        aiBusy = false;
        $("hintBtn").disabled = false;
      }
    });

    // 上传截图：调用「添加图片到评判上下文」埋点（块配置 multimodal=false 时父页面会 toast 提示）
    $("shotBtn").onclick = function () { $("shotFile").click(); };
    $("shotFile").onchange = function () {
      var f = $("shotFile").files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () {
        ctxImage(String(reader.result));
        $("shotFile").value = "";
      };
      reader.readAsDataURL(f);
    };

    render();
  })();
</script>
</body>
</html>
