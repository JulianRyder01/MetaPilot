<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>记分分类训练器 · 2022版记分规则</title>
<style>
  :root{
    --p12:#d33; --p9:#e67e22; --p6:#d4a017; --p3:#2e86c1; --p1:#27ae60;
    --bg:#f4f6fb; --card:#fff; --line:#e3e8f0; --ink:#243047; --sub:#7a8699;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);padding:16px}
  .wrap{max-width:760px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
  h1{font-size:19px}
  header small{color:var(--sub);font-weight:normal}
  .statbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;display:flex;gap:6px;align-items:center}
  .stat b{font-size:17px}
  .bar{height:8px;background:#eef1f6;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4facfe,#00f2fe);transition:width .3s}
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:0 2px 10px rgba(36,48,71,.05)}
  .qtag{display:inline-block;font-size:12px;color:var(--sub);background:#eef1f6;padding:3px 10px;border-radius:99px;margin-bottom:10px}
  .qtext{font-size:16px;line-height:1.7;min-height:60px}
  .pick{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:16px}
  @media(max-width:520px){.pick{grid-template-columns:repeat(3,1fr)}}
  .pick button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 0;font-size:16px;font-weight:700;cursor:pointer;transition:.15s;color:var(--ink)}
  .pick button:hover{border-color:#4facfe;transform:translateY(-2px);box-shadow:0 4px 12px rgba(79,172,254,.18)}
  .pick button:disabled{cursor:default;transform:none}
  .pick b{display:block;font-size:20px}
  .pick small{display:block;font-weight:400;color:var(--sub);font-size:11px}
  .fb{margin-top:16px;border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.7;display:none}
  .fb.right{background:#eafaf1;border:1px solid #b9e7cd}
  .fb.wrong{background:#fdf0ef;border:1px solid #f3c2bd}
  .fb .t{font-weight:700;margin-bottom:4px}
  .fb.right .t{color:#1d8a4e}
  .fb.wrong .t{color:#c0392b}
  .next{margin-top:14px;text-align:right}
  .btn{background:linear-gradient(135deg,#4facfe,#00f2fe);color:#fff;border:none;border-radius:10px;padding:10px 26px;font-size:15px;font-weight:600;cursor:pointer}
  .btn.ghost{background:#fff;color:#2e86c1;border:1.5px solid #2e86c1}
  .scoreRing{width:130px;height:130px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:18px auto;font-weight:700}
  .scoreRing .n{font-size:34px}
  .scoreRing .l{font-size:12px;color:var(--sub);font-weight:400}
  .result h3{text-align:center;margin-top:6px}
  .miss{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:10px;font-size:13px;line-height:1.6}
  .miss b{color:#c0392b}
  .miss .hint{color:var(--sub)}
  footer{color:var(--sub);font-size:12px;margin-top:14px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🚦 记分分类训练器 <small>《道路交通安全违法行为记分管理办法》(2022版 · 12/9/6/3/1)</small></h1>
  </header>
  <div id="gameArea"></div>
  <footer>提示：点击档位按钮作答，答对累计得分与连击。每轮 15 题，满分 100 分。</footer>
</div>
<script>
"use strict";
// 题库：行为 -> [档位, 解析]（依据公安部令第163号附件，2022-04-01施行）
const BANK = [
  // —— 12 分 ——
  ["饮酒后驾驶机动车（含醉酒驾驶）",12,"酒后驾驶害人害己，直接记满 12 分并暂扣/吊销驾驶证。"],
  ["使用伪造、变造的机动车号牌、行驶证、驾驶证",12,"使用伪造变造牌证属于严重违法，一次记 12 分。"],
  ["使用其他机动车的号牌、行驶证",12,"套用他人牌证同样记 12 分（俗称\"套牌\"）。"],
  ["造成致人轻伤以上或者死亡的交通事故后逃逸，尚不构成犯罪",12,"致人轻伤以上逃逸即记 12 分；未构成犯罪的才适用记分。"],
  ["在高速公路上倒车、逆行、穿越中央分隔带掉头",12,"高速倒车/逆行/穿越中央分隔带掉头，险中之险，一次记 12 分。"],
  ["代替实际驾驶人接受交通违法处罚和记分，牟取经济利益",12,"\"买卖分\"代扣分并牟利，记 12 分并处罚款。"],
  ["驾驶校车、公路客运、旅游客运载人超过核定人数 20% 以上",12,"客运车辆超员 20% 以上记 12 分（情节严重）"],
  ["校车、中型以上客货车、危化品车在高速公路、城市快速路上超速 20% 以上",12,"重点车辆在高速/快速路超速 20% 以上即记 12 分。"],
  ["驾驶其他机动车在高速公路、城市快速路上超速 50% 以上",12,"普通车在高速/快速路超速 50% 以上记 12 分。"],
  // —— 9 分 ——
  ["驾驶与准驾车型不符的机动车",9,"准驾不符（如 C1 开大货车）记 9 分，2022 新规由 12 分降为 9 分。"],
  ["未悬挂机动车号牌或故意遮挡、污损机动车号牌上路行驶",9,"不挂号牌/故意遮挡污损记 9 分；注意\"不按规定安装号牌\"只记 3 分。"],
  ["未取得校车驾驶资格驾驶校车",9,"无校车资格驾驶校车记 9 分。"],
  ["在高速公路、城市快速路上违法停车",9,"高速/快速路违法停车（非故障）记 9 分，与\"占用应急车道 6 分\"不要混淆。"],
  ["7 座以上载客汽车超员 50% 以上未达 100%",9,"7 座以上客车超员 50%-100% 记 9 分。"],
  ["校车、中型以上客货车、危化品车在高速以外道路超速 50% 以上",9,"重点车辆在普通道路超速 50% 以上记 9 分（普通车才记 6 分），极易考错！"],
  ["连续驾驶中型以上客货车、危化品车超过 4 小时未停车休息，或停车休息少于 20 分钟",9,"重点车辆疲劳驾驶记 9 分（普通货车记 3 分）。"],
  // —— 6 分 ——
  ["驾驶机动车不按交通信号灯指示通行（闯红灯）",6,"闯红灯一次记 6 分。"],
  ["在高速公路、城市快速路上违法占用应急车道行驶",6,"占用应急车道记 6 分；高速违法停车才记 9 分。"],
  ["驾驶证被暂扣或者扣留期间驾驶机动车",6,"扣证期间开车记 6 分，并处罚款。"],
  ["造成致人轻微伤或者财产损失的交通事故后逃逸，尚不构成犯罪",6,"轻微伤/财产损失逃逸记 6 分（致人轻伤以上逃逸记 12 分）。"],
  ["校车、中型以上客货车、危化品车在高速公路/快速路超速未达 20%",6,"重点车辆高速超速未达 20% 记 6 分（达到 20% 记 12 分）。"],
  ["校车、中型以上客货车、危化品车在高速以外道路超速 20% 以上未达 50%",6,"重点车辆普通道路超速 20%-50% 记 6 分。"],
  ["驾驶其他机动车在高速公路/快速路超速 20% 以上未达 50%",6,"普通车高速/快速路超速 20%-50% 记 6 分。"],
  ["驾驶其他机动车在高速以外道路超速 50% 以上",6,"普通车普通道路超速 50% 以上记 6 分。"],
  ["载货汽车超载超过最大允许总质量 50% 以上",6,"货车严重超载（>50%）记 6 分。"],
  // —— 3 分 ——
  ["驾驶其他机动车在高速以外道路超速 20% 以上未达 50%",3,"普通车普通道路超速 20%-50% 记 3 分。"],
  ["在高速公路、城市快速路上不按规定车道行驶",3,"高速公路不按规定车道行驶记 3 分。"],
  ["不按规定超车、让行，或者在高速以外道路逆行",3,"违规超车让行、普通道路逆行记 3 分。"],
  ["遇前方排队或缓慢行驶时借道超车、占用对面车道、穿插等候车辆",3,"\"加塞\"类行为记 3 分。"],
  ["拨打、接听手持电话等妨碍安全驾驶的行为",3,"开车接打手持电话记 3 分。"],
  ["行经人行横道不按规定减速、停车、避让行人",3,"不礼让斑马线记 3 分。"],
  ["驾驶机动车不按规定避让校车",3,"不避让校车记 3 分。"],
  ["载货汽车超载 30% 以上未达 50%，或违反规定载客",3,"货车超载 30%-50% 记 3 分（记住：超载与超速要区分）。"],
  ["驾驶不按规定安装机动车号牌的机动车上路行驶",3,"不按规定安装号牌记 3 分，与\"未悬挂/遮挡污损号牌 9 分\"区分。"],
  ["车辆故障、事故停车后不按规定使用灯光或设置警告标志",3,"故障/事故后未设警告标志记 3 分。（普通道路）"],
  ["在高速公路上行驶低于规定最低时速",3,"高速\"龟速\"低于最低限速记 3 分。"],
  ["连续驾驶载货汽车超过 4 小时未停车休息或休息少于 20 分钟",3,"普通货车疲劳驾驶记 3 分（重点车辆记 9 分）。"],
  // —— 1 分 ——
  ["校车、中型以上客货车、危化品车在高速以外道路超速 10% 以上未达 20%",1,"重点车辆普通道路超速 10%-20% 记 1 分。"],
  ["不按规定会车，或在高速以外道路不按规定倒车、掉头",1,"不按规定会车、普通道路违规倒车掉头记 1 分。"],
  ["驾驶机动车不按规定使用灯光",1,"不按规定使用灯光（如夜间不开灯）记 1 分。"],
  ["违反禁令标志、禁止标线指示",1,"违反禁令标志/标线（如压双黄实线）记 1 分，2022 新规由 3 分降为 1 分。"],
  ["载货汽车载货长度、宽度、高度超过规定",1,"货车超长/超宽/超高记 1 分。"],
  ["载货汽车超载未达最大允许总质量 30%",1,"货车轻微超载（<30%）记 1 分。"],
  ["驾驶机动车未按规定系安全带",1,"驾驶人不系安全带记 1 分，2022 新规由 2 分降为 1 分。"],
  ["驾驶未按规定定期进行安全技术检验的其他机动车上路行驶",1,"普通车逾期未年检记 1 分。"]
];
const ROUND = 15;
const LEVELS = [
  {v:12,label:"12分",cls:"p12",hint:"严重违法"},
  {v:1,label:"1分",cls:"p1",hint:"轻微"},
  {v:3,label:"3分",cls:"p3",hint:"一般"},
  {v:9,label:"9分",cls:"p9",hint:"较重"},
  {v:6,label:"6分",cls:"p6",hint:"较重"}
];
let deck=[],idx=0,score=0,combo=0,answered=false,missList=[],correctInRound=0;
const $=s=>document.querySelector(s);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function fmtScore(){return Math.round(correctInRound/ROUND*100);}
function renderStat(){
  const c=(idx+1)>ROUND?ROUND:(idx+1);
  $('#gameArea').innerHTML=`
    <div class="statbar">
      <div class="stat">第 <b>${c}</b> / ${ROUND} 题</div>
      <div class="stat">得分 <b>${fmtScore()}</b></div>
      <div class="stat">连击 <b>${combo}</b> 🔥</div>
      <div class="stat">已对 <b>${correctInRound}</b></div>
    </div>
    <div class="bar"><i style="width:${c/ROUND*100}%"></i></div>`;
}
function showResult(){
  const pct=fmtScore();
  const color = pct>=90?'#1d8a4e':pct>=70?'#d4a017':'#c0392b';
  const tip = pct>=90?'🎉 稳过 95+，保持手感即可！':pct>=70?'👍 基础扎实，重点攻克下方错题：':'📚 还需系统复习，从错题对应的章节练起：';
  let missHtml='';
  if(missList.length){
    missHtml = missList.map(m=>`<div class="miss"><b>[${m.point}分]</b> ${m.q}<div class="hint">${m.hint}</div></div>`).join('');
  }else{
    missHtml='<div class="miss">🎯 零失误，全对！可以进入模拟考试了。</div>';
  }
  $('#gameArea').innerHTML=`
    <div class="qcard result">
      <div class="scoreRing" style="background:conic-gradient(${color} ${pct*3.6}deg,#eef1f6 0deg)">
        <div class="n" style="color:${color}">${pct}</div><div class="l">本轮得分</div>
      </div>
      <h3>${tip}</h3>
      <div style="margin-top:14px">${missHtml}</div>
      <div class="next"><button class="btn" onclick="startGame()">🔁 再练一轮</button></div>
    </div>`;
}
function answer(v){
  if(answered)return;
  answered=true;
  const q=deck[idx];const right = q[1]===v;
  const lv=LEVELS.find(l=>l.v===v);
  const fb=$('#fb');
  if(right){score+=10;combo++;correctInRound++;}else{combo=0;missList.push({q:q[0],point:q[1],hint:q[2]});}
  const pct=fmtScore();
  document.querySelector('.statbar .stat b').textContent=(idx+1);
  fb.className='fb '+(right?'right':'wrong');fb.style.display='block';
  fb.innerHTML = right
    ? `<div class="t">✅ 回答正确！${lv.label} · 连击 ${combo}</div>${q[2]}`
    : `<div class="t">❌ 回答错误 · 正确档位是 <b>${q[1]} 分</b></div>${q[2]}`;
  const btns=document.querySelectorAll('.pick button');
  btns.forEach(b=>{b.disabled=true;if(parseInt(b.dataset.v,10)===q[1]){b.style.background='#eafaf1';b.style.borderColor='#1d8a4e';}else if(parseInt(b.dataset.v,10)===v){b.style.background='#fdf0ef';b.style.borderColor='#c0392b';}});
  const nx=$('#nextBtn');
  nx.style.display='inline-block';
  nx.textContent = idx+1>=ROUND ? '查看成绩 →' : '下一题 →';
}
function renderQuestion(){
  answered=false;
  renderStat();
  const q=deck[idx];
  const order=shuffle(LEVELS);
  $('#gameArea').innerHTML += `
    <div class="qcard">
      <span class="qtag">该行为应记多少分？</span>
      <div class="qtext">${q[0]}</div>
      <div class="pick">
        ${order.map(l=>`<button data-v="${l.v}" style="--lc:${l.v===12?'var(--p12)':l.v===9?'var(--p9)':l.v===6?'var(--p6)':l.v===3?'var(--p3)':'var(--p1)'}" onclick="answer(${l.v})"><b>${l.v}</b><small>${l.hint}</small></button>`).join('')}
      </div>
      <div class="fb" id="fb"></div>
      <div class="next"><button class="btn ghost" id="nextBtn" style="display:none" onclick="nextQ()">下一题 →</button></div>
    </div>`;
}
function nextQ(){
  if(idx+1>=ROUND){showResult();return;}
  idx++;renderQuestion();
}
function startGame(){
  deck=shuffle(BANK).slice(0,ROUND);idx=0;score=0;combo=0;correctInRound=0;missList=[];
  renderQuestion();
}
startGame();
</script>
</body>
</html>
