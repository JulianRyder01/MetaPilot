<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高速公路情景模拟 · 一路开车一路考</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#0e1a2b;color:#e8f0fb;padding:16px;min-height:100vh}
  .wrap{max-width:720px;margin:0 auto}
  header{text-align:center;margin-bottom:12px}
  h1{font-size:20px;background:linear-gradient(90deg,#4facfe,#00f2fe);-webkit-background-clip:text;background-clip:text;color:transparent}
  .road{position:relative;height:70px;border-radius:12px;overflow:hidden;background:
    repeating-linear-gradient(90deg,#3a4a63 0 40px,#44557a 40px 200px);
    display:flex;align-items:center;justify-content:space-between;padding:0 14px;margin-bottom:14px}
  .road .lane{flex:1;height:6px;border-left:2px dashed #aebfde;margin:0 6px}
  .car{font-size:22px;transition:margin-left .6s}
  .scene{background:#16273e;border:1px solid #2a3f5f;border-radius:16px;padding:18px 20px;margin-bottom:12px}
  .scene .km{font-size:12px;color:#7fa3cc;margin-bottom:6px}
  .scene h3{font-size:17px;line-height:1.6;margin-bottom:8px}
  .scene p{font-size:14px;line-height:1.8;color:#b9c9e2}
  .opts{display:flex;flex-direction:column;gap:9px;margin-top:6px}
  .opts button{background:#1d3452;border:1.5px solid #33507a;color:#e8f0fb;border-radius:11px;padding:12px 14px;font-size:14px;text-align:left;cursor:pointer;font-family:inherit;transition:.15s;line-height:1.6}
  .opts button:hover:not(:disabled){border-color:#4facfe;background:#24405f}
  .opts button:disabled{cursor:default}
  .opts button.ok{background:#0f3d2a;border-color:#1d8a4e}
  .opts button.bad{background:#4a1f2b;border-color:#c0392b}
  .fb{margin-top:12px;border-radius:11px;padding:12px 15px;font-size:13.5px;line-height:1.8;display:none}
  .fb.good{background:rgba(29,138,78,.15);border:1px solid #1d8a4e;color:#7ee2a8}
  .fb.bad{background:rgba(192,57,43,.15);border:1px solid #c0392b;color:#ffb3ac}
  .hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px}
  .hud .points{font-size:14px;background:#16273e;border:1px solid #2a3f5f;border-radius:99px;padding:6px 16px}
  .hud .points b{color:#ffd200}
  .btn{background:linear-gradient(135deg,#4facfe,#00f2fe);border:none;color:#062030;border-radius:10px;padding:10px 22px;font-size:14px;font-weight:700;cursor:pointer}
  .end{text-align:center;padding:20px 0}
  .end .grade{font-size:52px;font-weight:800;background:linear-gradient(90deg,#ffd200,#ff8c00);-webkit-background-clip:text;background-clip:text;color:transparent}
  .end .sub{color:#b9c9e2;margin-top:8px;line-height:1.8;font-size:14px}
  footer{color:#5a7395;font-size:12px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>🛣️ 高速公路情景模拟</h1></header>
  <div class="road" id="road"><span class="car" id="car">🚗</span><span></span><span class="lane"></span><span class="lane"></span><span class="lane"></span><span>🏁</span></div>
  <div class="hud">
    <div class="points">🛡️ 安全分 <b id="pts">100</b> / 100</div>
    <div id="navBtn"></div>
  </div>
  <div id="stage"></div>
  <footer>情景题：选择你认为正确的做法。<b style="color:#ffd200">全对=安全分100</b>；关键错项会扣分并解释原因。</footer>
</div>
<script>
"use strict";
/* 情景剧本：从出发到驶离高速的连续决策 */
const STEPS=[
  {
    km:"出发前 · 收费站外", text:"周末自驾去外地。上车前，你应该先做什么？",
    opts:["系好安全带，检查后视镜和仪表；确认证件、号牌完好","直接点火出发，赶时间","先开导航，边开边调"],
    good:[0], cost:[0,15,8],
    fb:"出发前必做：系好安全带、调整后视镜座椅、看仪表是否正常、确认号牌证件齐全。边开车边调导航很危险。"
  },
  {
    km:"驶入高速 · 匝道", text:"进入高速匝道，准备汇入主路。正确的做法是？",
    opts:["在加速车道上尽快提速，接近车流速度后打左转向灯汇入","低速慢行，等旁边没车再猛地并线","直接从匝道压导流线切入"],
    good:[0], cost:[0,15,15],
    fb:"匝道进入前先在加速车道提速至与车流接近的速度，开左转向灯，观察后视镜确认安全再汇入。低速强行并线极易引发追尾。"
  },
  {
    km:"主路行驶 · 左侧行车道", text:"你行驶在最左侧车道，时速 96 km/h。3 条车道的高速，这合理吗？",
    opts:["合理，保持 96 匀速行驶","不合理——最左侧车道最低限速 110，应驶回中间/右侧车道","加速到 140 超车更安全"],
    good:[1], cost:[15,0,20],
    fb:"3 条车道时最左侧车道最低 110 km/h。低于该速度长时间占用最左道属于\"不按规定车道行驶\"（记3分），应回到中间或右侧车道。"
  },
  {
    km:"雨天 · 路面湿滑", text:"下大雨，能见度明显下降。你应该？",
    opts:["开启雾灯、近光灯（必要时加危险报警闪光灯），降低车速、加大车距","开启远光灯照得更远更安全","保持原速，开启双闪继续压着最左道开"],
    good:[0], cost:[0,12,12],
    fb:"雨雾天开雾灯+近光+示廓灯（能见度极低再加双闪），降速、拉大车距；远光灯在雨雾中会形成白障，更看不清。"
  },
  {
    km:"前方拥堵", text:"前方车流缓行，你需要与前车保持的车距至少是？",
    opts:["紧贴前车防止被加塞（约 5 米）","随大流，保持 30 米","保持足以应对突发情况的跟车距离：时速 60 时不少于 50 米，并随时准备制动"],
    good:[2], cost:[15,10,0],
    fb:"跟车距离：时速≥100 保持 100 米以上，时速<100 保持 50 米以上。雨天还要翻倍。紧贴前车是追尾最常见的诱因。"
  },
  {
    km:"故障 · 突然熄火", text:"车辆突然抖动熄火，停在行车道。正确处置顺序是？",
    opts:["立即从车里跳出来站在车后指挥","开启危险报警闪光灯→尽量滑行至应急车道/右侧路肩→车后 150 米外放警告标志→人员撤离至护栏外→报警","把车留在行车道，打双闪等救援拖车自己来"],
    good:[1], cost:[20,0,10],
    fb:"处置四步：①双闪；②靠边（应急车道/路肩）；③来车方向 150 米外放警告标志（普通道路 50-100 米）；④人员撤到护栏外并报警。人一定要离开车道！"
  },
  {
    km:"夜间 · 会车区段", text:"夜间在高速上行驶，与前车距离较近。灯光应使用？",
    opts:["远光灯，看得远","近光灯，避免照射影响前车驾驶人","闪几下远光提醒前车让路"],
    good:[1], cost:[10,0,5],
    fb:"跟车行驶时使用近光灯，避免远光通过后视镜干扰前车驾驶人；同向近距离行驶不得使用远光灯。"
  },
  {
    km:"错过出口", text:"你要在下一出口驶离，但眼看就要错过匝道口了。此时应该？",
    opts:["紧急制动，强行向右变道压导流线驶出","到下一出口再驶离，多绕一段路","在行车道停车倒回出口"],
    good:[1], cost:[20,0,25],
    fb:"错过出口只能继续前行到下一个出口驶离。急刹、连续变道、倒车、逆行都极其危险——高速倒车逆行记 12 分！"
  },
  {
    km:"驶离高速 · 出口匝道", text:"驶入出口匝道后，正确做法是？",
    opts:["减速至匝道限速（通常 40-60），依次通过","保持 100 匀速冲出匝道","超车赶在入口封闭前通过"],
    good:[0], cost:[0,15,10],
    fb:"匝道限速低、弯道急，必须提前减速按规定车速通过；匝道上超车、超速极易侧翻。"
  }
];
let idx=0,pts=100,answered=false;
const $=s=>document.querySelector(s);
function render(){
  answered=false;
  const s=STEPS[idx];
  $('#pts').textContent=pts;
  $('#stage').innerHTML=`
    <div class="scene">
      <div class="km">📍 ${s.km}</div>
      <h3>${s.text}</h3>
      <div class="opts">${s.opts.map((o,i)=>`<button onclick="choose(${i})">${o}</button>`).join('')}</div>
      <div class="fb" id="fb"></div>
    </div>`;
  const nav=$('#navBtn');
  nav.innerHTML='';
  document.getElementById('car').style.marginLeft=(idx*6)+'px';
}
function choose(i){
  if(answered)return;answered=true;
  const s=STEPS[idx];
  const ok=s.good.includes(i);
  if(!ok)pts-=s.cost[i];
  const btns=document.querySelectorAll('.opts button');
  btns.forEach((b,j)=>{
    b.disabled=true;
    if(s.good.includes(j))b.classList.add('ok');
    else if(j===i)b.classList.add('bad');
  });
  const fb=$('#fb');
  fb.style.display='block';
  fb.className='fb '+(ok?'good':'bad');
  fb.innerHTML=(ok?'✅ 处置正确！ ':'❌ 危险处置！ ')+s.fb;
  $('#navBtn').innerHTML='<button class="btn" onclick="next()">'+(idx+1>=STEPS.length?'🏁 到达终点':'下一步 →')+'</button>';
}
function next(){
  if(idx+1>=STEPS.length){end();return;}
  idx++;render();
}
function end(){
  const g = pts>=95?'A+ 完美':pts>=85?'A 优秀':pts>=70?'B 良好':pts>=50?'C 及格':'D 不及格';
  const tip = pts>=95?'每次高速驾驶都游刃有余！':pts>=85?'个别细节再巩固一下（注意看错题解释）：':pts>=70?'建议返回第7章重学高速公路驾驶后再来。':'危险操作太多，请重学第7章高速公路驾驶后再来：';
  $('#stage').innerHTML=`
    <div class="end">
      <div class="grade">${g}</div>
      <div class="sub"><b style="color:#ffd200">安全分 ${pts} / 100</b><br>${tip}</div>
      <div style="margin-top:16px"><button class="btn" onclick="restart()">🔄 重新挑战</button></div>
    </div>`;
}
function restart(){idx=0;pts=100;render();}
render();
</script>
</body>
</html>
