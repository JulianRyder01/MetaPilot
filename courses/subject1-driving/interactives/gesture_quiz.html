<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交警手势识别 · 看图答题</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f4f6fb;color:#243047;padding:16px}
  .wrap{max-width:780px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
  h1{font-size:19px}
  .mode{display:flex;gap:8px}
  .mode button{border:1.5px solid #e3e8f0;background:#fff;border-radius:99px;padding:6px 16px;font-size:13px;cursor:pointer}
  .mode button.on{background:linear-gradient(135deg,#7f5af0,#5a3fd0);color:#fff;border-color:transparent}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
  .gcard{background:#fff;border:1px solid #e3e8f0;border-radius:12px;padding:12px;text-align:center;cursor:pointer;transition:.15s}
  .gcard:hover{border-color:#7f5af0;transform:translateY(-2px);box-shadow:0 4px 12px rgba(127,90,240,.15)}
  .gcard .nm{font-size:14px;font-weight:700;margin-top:6px}
  .gcard .mn{font-size:12px;color:#7a8699;margin-top:3px;line-height:1.6}
  .quizview{background:#fff;border:1px solid #e3e8f0;border-radius:16px;padding:22px;max-width:600px;margin:0 auto;text-align:center}
  .qstat{font-size:13px;color:#7a8699;margin-bottom:8px}
  .big{background:linear-gradient(180deg,#eef1f6,#f8fafc);border-radius:14px;padding:12px;margin-bottom:12px}
  .qop{display:block;width:100%;border:1.5px solid #e3e8f0;background:#fff;border-radius:10px;padding:11px 14px;margin-top:9px;font-size:14px;cursor:pointer;font-family:inherit;text-align:left}
  .qop:hover{border-color:#7f5af0}
  .qop.ok{background:#eafaf1;border-color:#1d8a4e}
  .qop.no{background:#fdf0ef;border-color:#c0392b}
  .qmsg{font-size:13px;margin-top:10px;line-height:1.7;color:#7a8699}
  footer{color:#7a8699;font-size:12px;text-align:center;margin-top:14px}
  .btn{background:linear-gradient(135deg,#7f5af0,#5a3fd0);color:#fff;border:none;border-radius:10px;padding:9px 20px;font-size:14px;cursor:pointer;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>👮 交警手势识别 <small>学习 7 种常用手势（示意简画，考试以图片题为准）</small></h1>
    <div class="mode">
      <button id="mL" class="on" onclick="setMode('learn')">📖 学习</button>
      <button id="mQ" onclick="setMode('quiz')">✏️ 测验</button>
    </div>
  </header>
  <div id="browse" class="grid"></div>
  <div class="quizview" id="quizview" style="display:none">
    <div class="qstat" id="qstat"></div>
    <div class="big" id="qsign"></div>
    <div id="qops"></div>
    <div class="qmsg" id="qmsg"></div>
  </div>
  <footer>提示：交警手势的优先级高于信号灯与标志标线——交警指挥 > 信号灯 > 标志标线。</footer>
</div>
<script>
"use strict";
/* 小人 SVG：头 + 躯干 + 腿固定，手臂按手势姿态变化 */
function officer(arms,note){
  const h=`<circle cx="60" cy="34" r="11" fill="#3b3b3b"/><path d="M60 48 L60 78" stroke="#3b3b3b" stroke-width="6" stroke-linecap="round"/>
  <path d="M60 58 L40 76 M60 58 L80 76" stroke="#3b3b3b" stroke-width="6" stroke-linecap="round"/>`;
  const body=`<path d="M55 104 L60 78 L65 104" fill="#2f5d8a"/>`;
  return `<svg width="150" height="150" viewBox="0 0 120 150">${h}${arms}${body}${note||''}</svg>`;
}
const polyline=(pts)=>`<polyline points="${pts}" fill="none" stroke="#2f5d8a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`;
const GESTURES=[
  {name:"停止信号",mn:"一只手臂向上伸直、掌心向前，示意停车",draw:()=>officer(polyline("60,46 60,8")+`<circle cx="60" cy="8" r="7" fill="#ffffff" stroke="#c0392b" stroke-width="3"/>`+polyline("60,46 92,52"),`<text x="52" y="135" font-size="13" fill="#c0392b">手掌向前</text>`)},
  {name:"直行信号",mn:"两臂向左右平伸、掌心向前，示意直行通过",draw:()=>officer(polyline("60,46 16,34")+polyline("60,46 104,34")+`<circle cx="16" cy="34" r="8" fill="#fff" stroke="#2f5d8a" stroke-width="3"/><circle cx="104" cy="34" r="8" fill="#fff" stroke="#2f5d8a" stroke-width="3"/>`,null)},
  {name:"左转弯信号",mn:"右臂前伸、掌心向前，左臂向胸前摆动，示意车辆左转弯",draw:()=>officer(polyline("60,46 30,40")+polyline("60,46 78,70")+`<circle cx="30" cy="40" r="8" fill="#fff" stroke="#2f5d8a" stroke-width="3"/><path d="M70 60 A30 30 0 0 1 96 66" stroke="#c0392b" stroke-width="4" fill="none" stroke-dasharray="4 4"/>`,null)},
  {name:"右转弯信号",mn:"左臂前伸、掌心向前，右臂向胸前摆动，示意车辆右转弯",draw:()=>officer(polyline("60,46 90,40")+polyline("60,46 44,70")+`<circle cx="90" cy="40" r="8" fill="#fff" stroke="#2f5d8a" stroke-width="3"/><path d="M52 60 A30 30 0 0 0 26 66" stroke="#c0392b" stroke-width="4" fill="none" stroke-dasharray="4 4"/>`,null)},
  {name:"左转弯待转信号",mn:"左臂向下方平伸，掌心向下，上下摆动，示意左转车辆进入待转区",draw:()=>officer(polyline("60,46 26,64")+`<circle cx="26" cy="64" r="8" fill="#fff" stroke="#2f5d8a" stroke-width="3"/><path d="M30 78 L20 72 M30 78 L22 84" stroke="#c0392b" stroke-width="3.5"/>`,null)},
  {name:"减速慢行信号",mn:"右臂向右前方平伸，掌心向下，上下摆动，示意减速",draw:()=>officer(polyline("60,46 96,60")+`<circle cx="96" cy="60" r="8" fill="#fff" stroke="#2f5d8a" stroke-width="3"/><path d="M100 74 L110 66 M100 74 L110 80" stroke="#c0392b" stroke-width="3.5"/>`,null)},
  {name:"变道信号",mn:"左臂向前平伸、掌心向前，右臂向左摆动，示意车辆变更车道",draw:()=>officer(polyline("60,46 22,44")+polyline("60,46 82,66")+`<circle cx="22" cy="44" r="8" fill="#fff" stroke="#2f5d8a" stroke-width="3"/>`,null)}
];
let mode='learn',quiz=[],qi=0,score=0,qTimer=null;
const $=s=>document.querySelector(s);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function setMode(m){
  mode=m;
  $('#mL').className=m==='learn'?'on':'';$('#mQ').className=m==='quiz'?'on':'';
  if(m==='learn'){if(qTimer)clearTimeout(qTimer);renderBrowse();}else startQuiz();
}
function renderBrowse(){
  $('#browse').style.display='grid';
  $('#quizview').style.display='none';
  $('#browse').innerHTML=GESTURES.map(g=>`
    <div class="gcard"><div>${g.draw()}</div><div class="nm">${g.name}</div><div class="mn">${g.mn}</div></div>`).join('');
}
function startQuiz(){
  if(qTimer)clearTimeout(qTimer);
  quiz=shuffle(GESTURES);qi=0;score=0;
  $('#browse').style.display='none';
  $('#quizview').style.display='block';
  renderQuiz();
}
function renderQuiz(){
  const q=quiz[qi];
  const decoys=shuffle(GESTURES.filter(x=>x!==q)).slice(0,3);
  const opts=shuffle([q,...decoys]);
  $('#qstat').textContent=`第 ${qi+1} / ${quiz.length} 题 · 得分 ${score} · 这个手势表示什么？`;
  $('#qsign').innerHTML=q.draw();
  $('#qops').innerHTML=opts.map(o=>`<button class="qop" data-n="${o.name}">${o.name}</button>`).join('');
  $('#qmsg').innerHTML='';
  document.querySelectorAll('#qops .qop').forEach(b=>b.onclick=()=>pick(b.dataset.n,q));
}
function pick(chosen,q){
  const ok=chosen===q.name;
  if(ok)score++;
  document.querySelectorAll('#qops .qop').forEach(b=>{
    b.disabled=true;
    if(b.dataset.n===q.name)b.classList.add('ok');
    if(b.dataset.n===chosen&&!ok)b.classList.add('no');
  });
  $('#qmsg').innerHTML=ok?`✅ 正确！${q.mn}`:`❌ 它是「${q.name}」：${q.mn}`;
  qTimer=setTimeout(()=>{
    if(qi+1>=quiz.length){
      $('#qstat').textContent='';
      $('#qsign').innerHTML=`<div style="font-size:40px;font-weight:800;color:#5a3fd0">${score}/${quiz.length}</div>
        <div style="margin-top:8px">${score>=6?'手势掌握得不错！':'回学习模式再过一遍 7 种手势。'}</div>`;
      $('#qops').innerHTML='<button class="qop" onclick="startQuiz()" style="text-align:center;color:#7f5af0;font-weight:700">🔁 再测一轮</button>';
      $('#qmsg').innerHTML='';
    }else{qi++;renderQuiz();}
  },1600);
}
setMode('learn');
</script>
</body>
</html>
