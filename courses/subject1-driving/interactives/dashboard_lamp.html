<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仪表指示灯识别 · 仪表盘训练</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#101722;color:#e8f0fb;padding:16px}
  .wrap{max-width:820px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
  h1{font-size:19px}
  .mode{display:flex;gap:8px}
  .mode button{border:1.5px solid #2a3f5f;background:#16273e;color:#b9c9e2;border-radius:99px;padding:6px 16px;font-size:13px;cursor:pointer}
  .mode button.on{background:linear-gradient(135deg,#00c6a7,#1be0b6);color:#04201a;border-color:transparent;font-weight:700}
  .dash{background:radial-gradient(ellipse at 50% 30%,#1c2a42,#0d1626);border:3px solid #33507a;border-radius:110px;padding:22px 26px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .lamp{border-radius:22px;padding:16px 10px 14px;min-width:86px;text-align:center;cursor:pointer;transition:.15s;border:1px solid #2a3f5f}
  .lamp:hover{transform:translateY(-3px);border-color:#00c6a7}
  .lamp .icon{font-size:30px;line-height:1;margin-bottom:6px}
  .lamp .nm{font-size:11.5px;color:#9db2cf;line-height:1.4}
  .lamp.on{background:rgba(255,255,255,.06);box-shadow:inset 0 0 14px rgba(0,198,167,.25)}
  .quizview{background:#16273e;border:1px solid #2a3f5f;border-radius:16px;padding:20px;max-width:560px;margin:0 auto;display:none;text-align:center}
  .qstat{font-size:13px;color:#9db2cf;margin-bottom:10px}
  .qbig{font-size:64px;margin:8px 0}
  .qop{display:block;width:100%;background:#1d3452;border:1.5px solid #33507a;color:#e8f0fb;border-radius:10px;padding:11px 14px;margin-top:9px;font-size:14px;cursor:pointer;font-family:inherit;text-align:left}
  .qop:hover{border-color:#00c6a7}
  .qop.ok{background:#0f3d2a;border-color:#1d8a4e}
  .qop.no{background:#4a1f2b;border-color:#c0392b}
  .qmsg{font-size:13px;margin-top:10px;line-height:1.7;color:#9db2cf}
  footer{color:#5a7395;font-size:12px;text-align:center;margin-top:14px}
  .btn{background:linear-gradient(135deg,#00c6a7,#1be0b6);border:none;color:#04201a;border-radius:10px;padding:9px 20px;font-size:14px;cursor:pointer;font-weight:700}
  .hint{font-size:12px;color:#5a7395;margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>💡 仪表指示灯识别 <small>看到灯亮，你要知道它在说什么</small></h1>
    <div class="mode">
      <button id="mL" class="on" onclick="setMode('learn')">📖 学习</button>
      <button id="mQ" onclick="setMode('quiz')">✏️ 测验</button>
    </div>
  </header>
  <div class="hint">红灯亮=立即停车/处理；黄灯亮=尽快检查；绿灯/蓝灯=功能指示。<b style="color:#ffd200">点击学习模式下的指示灯查看含义。</b></div>
  <div class="dash" id="dash"></div>
  <div class="quizview" id="quizview">
    <div class="qstat" id="qstat"></div>
    <div class="qbig" id="qbig"></div>
    <div class="qmsg" id="qmsg2" style="margin-bottom:10px"></div>
    <div id="qops"></div>
    <div class="qmsg" id="qmsg"></div>
  </div>
  <footer>提示：考试常考\"灯亮时应怎样做\"——红色报警灯亮起必须立即安全停车检查。</footer>
</div>
<script>
"use strict";
const LAMPS=[
  {icon:"⭕P",color:"#ff3b30",name:"驻车制动（手刹）指示灯",act:"手刹未松开或未完全松开；起步前确认放下手刹",lvl:"红"},
  {icon:"🛢️",color:"#ff3b30",name:"机油压力报警灯",act:"机油压力过低，立即停车熄火检查，继续行驶会损坏发动机",lvl:"红"},
  {icon:"🌡️",color:"#ff3b30",name:"水温（发动机温度）报警灯",act:"发动机过热，立即安全停车怠速降温检查冷却液",lvl:"红"},
  {icon:"🔋",color:"#ff3b30",name:"充电（蓄电池）警示灯",act:"充电系统故障，发电机不工作，检查电瓶与线路",lvl:"红"},
  {icon:"🚪",color:"#ff3b30",name:"车门未关提示灯",act:"有车门未关紧，立即检查关闭后再行驶",lvl:"红"},
  {icon:"🪑",color:"#ff3b30",name:"安全带未系提醒",act:"驾驶人/乘客未系安全带，系好后熄灭",lvl:"红"},
  {icon:"⚙️",color:"#ffb800",name:"发动机故障灯（黄）",act:"发动机电控系统故障，尽快检修，避免带病行驶",lvl:"黄"},
  {icon:"ABS",color:"#ffb800",name:"ABS 防抱死制动系统故障灯",act:"ABS 故障，制动仍可用但防抱死失效，谨慎驾驶并及时检修",lvl:"黄"},
  {icon:"(!)",color:"#ffb800",name:"胎压报警灯",act:"某个轮胎气压异常，降低车速安全停车检查",lvl:"黄"},
  {icon:"⛽",color:"#ffb800",name:"燃油不足警示灯",act:"燃油即将耗尽，尽快加油",lvl:"黄"},
  {icon:"🔆",color:"#4da3ff",name:"远光灯指示灯",act:"开启远光灯（夜间照明良好路段应切换近光）",lvl:"蓝"},
  {icon:"➡️",color:"#1be0b6",name:"转向灯指示灯（绿）",act:"转向/变道灯开启，完成操作后关闭",lvl:"绿"},
  {icon:"🌫️",color:"#1be0b6",name:"雾灯指示灯（绿）",act:"雾灯开启（雨雾天气使用）",lvl:"绿"}
];
let mode='learn',quiz=[],qi=0,score=0,sel=null,qTimer=null;
const $=s=>document.querySelector(s);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function setMode(m){
  mode=m;sel=null;
  $('#mL').className=m==='learn'?'on':'';$('#mQ').className=m==='quiz'?'on':'';
  if(m==='learn'){if(qTimer)clearTimeout(qTimer);renderDash();}else startQuiz();
}
function renderDash(){
  $('#quizview').style.display='none';
  $('#dash').style.display='flex';
  $('#dash').innerHTML=LAMPS.map((l,i)=>`
    <div class="lamp on" onclick="showDetail(${i})">
      <div class="icon" style="color:${l.color}">${l.icon}</div>
      <div class="nm">${l.name}</div>
    </div>`).join('');
}
function showDetail(i){
  const l=LAMPS[i];
  const lvl={红:"🚨 红色 = 报警/故障",黄:"⚠️ 黄色 = 警告",蓝:"🔵 蓝色 = 灯光指示",绿:"🟢 绿色 = 功能指示"}[l.lvl];
  alert(`【${l.name}】\n${lvl}\n${l.lvl==='红'?'应做：':'处理：'}${l.act}`);
}
function startQuiz(){
  if(qTimer)clearTimeout(qTimer);
  quiz=shuffle(LAMPS).slice(0,10);qi=0;score=0;
  $('#dash').style.display='none';
  $('#quizview').style.display='block';
  renderQuiz();
}
function renderQuiz(){
  const q=quiz[qi];
  const decoys=shuffle(LAMPS.filter(x=>x!==q)).slice(0,3);
  const opts=shuffle([q,...decoys]);
  $('#qstat').textContent=`第 ${qi+1} / ${quiz.length} 题 · 得分 ${score} · 这个指示灯亮起代表什么？`;
  $('#qbig').innerHTML=`<div style="display:inline-block;background:#0d1626;border:2px solid #2a3f5f;border-radius:26px;padding:18px 30px"><span style="color:${q.color};font-size:56px">${q.icon}</span></div>`;
  $('#qmsg2').textContent=`（灯色：${q.lvl}色）`;
  $('#qops').innerHTML=opts.map(o=>`<button class="qop" data-n="${o.name}">${o.name}</button>`).join('');
  $('#qmsg').innerHTML='';
  document.querySelectorAll('#qops .qop').forEach(b=>b.onclick=()=>pick(b.dataset.n,q));
}
function pick(chosen,q){
  const ok=chosen===q.name;
  if(ok)score++;
  document.querySelectorAll('#qops .qop').forEach(b=>{
    b.disabled=true;
    if(b.dataset.n===q.name)b.classList.add('ok');
    if(b.dataset.n===chosen&&!ok)b.classList.add('no');
  });
  $('#qmsg').innerHTML=ok?`✅ 正确！${q.act}`:`❌ 它是「${q.name}」：${q.act}`;
  qTimer=setTimeout(()=>{
    if(qi+1>=quiz.length){
      $('#qstat').textContent='';
      $('#qbig').innerHTML=`<div style="font-size:44px;font-weight:800;color:#1be0b6">${score}/${quiz.length}</div>
        <div style="margin-top:8px">${score>=8?'仪表灯认全了，上路很安心！':'回学习模式再认一遍指示灯。'}</div>`;
      $('#qmsg2').innerHTML='';$('#qmsg').innerHTML='';
      $('#qops').innerHTML='<button class="qop" onclick="startQuiz()" style="text-align:center;color:#00c6a7;font-weight:700">🔁 再测一轮</button>';
    }else{qi++;renderQuiz();}
  },1600);
}
setMode('learn');
</script>
</body>
</html>
