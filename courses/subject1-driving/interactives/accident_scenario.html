<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>事故现场处置情景演练（AI 评判）</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#141b2b;color:#e8f0fb;padding:16px;min-height:100vh}
  .wrap{max-width:760px;margin:0 auto}
  header h1{font-size:20px;text-align:center}
  header p{font-size:12.5px;color:#7fa3cc;text-align:center;margin-top:6px;line-height:1.7}
  .log{background:#0e1626;border:1px solid #24344d;border-radius:12px;padding:12px 14px;font-size:12.5px;color:#9db2cf;margin:12px 0;height:120px;overflow-y:auto;line-height:1.8}
  .log b{color:#ffd200}
  .scene{background:#16273e;border:1px solid #2a3f5f;border-radius:16px;padding:18px 20px;margin-bottom:12px}
  .scene .km{font-size:12px;color:#7fa3cc;margin-bottom:6px}
  .scene h3{font-size:16.5px;line-height:1.7;margin-bottom:10px}
  .opts{display:flex;flex-direction:column;gap:9px}
  .opts button{background:#1d3452;border:1.5px solid #33507a;color:#e8f0fb;border-radius:11px;padding:12px 14px;font-size:14px;text-align:left;cursor:pointer;font-family:inherit;transition:.15s;line-height:1.6}
  .opts button:hover:not(:disabled){border-color:#4facfe;background:#24405f}
  .opts button:disabled{cursor:default}
  .opts button.ok{background:#0f3d2a;border-color:#1d8a4e}
  .opts button.bad{background:#4a1f2b;border-color:#c0392b}
  .fb{margin-top:12px;border-radius:11px;padding:12px 15px;font-size:13.5px;line-height:1.8;display:none}
  .fb.good{background:rgba(29,138,78,.15);border:1px solid #1d8a4e;color:#7ee2a8}
  .fb.bad{background:rgba(192,57,43,.15);border:1px solid #c0392b;color:#ffb3ac}
  .hud{display:flex;justify-content:space-between;align-items:center;margin:10px 0;flex-wrap:wrap;gap:8px}
  .hud .pts{background:#16273e;border:1px solid #2a3f5f;border-radius:99px;padding:6px 16px;font-size:13.5px}
  .hud .pts b{color:#ffd200}
  .btn{background:linear-gradient(135deg,#4facfe,#00f2fe);border:none;color:#062030;border-radius:10px;padding:10px 22px;font-size:14px;font-weight:700;cursor:pointer}
  .btn.submit{background:linear-gradient(135deg,#ffd200,#ff8c00);color:#3d2b00}
  .end{text-align:center;padding:14px 0}
  .end .grade{font-size:46px;font-weight:800;background:linear-gradient(90deg,#ffd200,#ff8c00);-webkit-background-clip:text;background-clip:text;color:transparent}
  .end .sub{color:#b9c9e2;margin-top:8px;font-size:14px;line-height:1.8}
  footer{color:#5a7395;font-size:12px;text-align:center;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🚨 事故现场处置情景演练</h1>
    <p>你将经历一起轻微追尾事故，逐站做出处置决策。每一步都会记录到<b>评判上下文</b>；全部处置完毕后，点击右下角「结束并提交给 AI 评判」，AI 将按《道路交通安全法》给出综合评分与改进建议（即使不提交，本地也会显示基础评分）。</p>
  </header>
  <div class="hud">
    <div class="pts">🛡️ 处置分 <b id="pts">100</b></div>
    <button class="btn submit" id="finishBtn" style="display:none" onclick="submitToAI()">✨ 结束并提交给 AI 评判</button>
  </div>
  <div class="log" id="log"><b>📋 事件记录</b><br></div>
  <div id="stage"></div>
  <footer>提示：本练习用于加深\"车靠边、人撤离、即报警\"的肌肉记忆；实际事故请以交警处理为准。</footer>
</div>
<script>
"use strict";
/* 决策链：轻微追尾事故处置 */
const STEPS=[
  {
    km:"第1站 · 碰撞发生", text:"夜间城市道路，你驾车被后车追尾，双方车辆还能移动，无人受伤。首先应该？",
    opts:["立即开启危险报警闪光灯，拉紧手刹，在车后设置警告标志（普通道路 50-100 米）","坐在车里和对方理论","下车站到两车中间查看损伤"],
    good:[0], cost:[0,20,15],
    fb:"第一步永远是：双闪 + 车后设警告标志（普通道路 50-100 米，高速 150 米外）+ 人员撤到安全地带。站在车道中间最危险。",
    record:"第1站：开启了双闪并设置警告标志" 
  },
  {
    km:"第2站 · 先救人还是先拍车", text:"确认无人受伤、车辆可移动。接下来应优先做什么？",
    opts:["拍照固定证据（全景、碰撞部位、牌照），然后双方将车移到不妨碍交通的地点","原地不动等交警来，塑造现场","先和对方争论责任归属（吵 20 分钟）"],
    good:[0], cost:[0,15,10],
    fb:"轻微事故（无人伤、可移动）：先拍照取证再快速挪车，避免造成拥堵；因不挪车造成拥堵或二次事故，可能被记 6 分。",
    record:"第2站：拍照固定证据后将车辆移至不妨碍交通处"
  },
  {
    km:"第3站 · 对方要私了", text:"对方说\"给 200 元咱们私了，别报警别报保险\"。此时应？",
    opts:["先核对对方证件/保险信息，拨打 110 或 122 报警备案，按快处快赔流程处理","收现金走人，最省事","不核验证件，直接留电话就开走"],
    good:[0], cost:[0,10,15],
    fb:"私了也要走正规流程：双方拍摄证件、互留联系方式、报警或线上快处快赔备案，切勿无凭无据收钱私了（后续难追责）。",
    record:"第3站：核对对方证件并报警备案处理"
  },
  {
    km:"第4站 · 撤离与疏导", text:"双方车辆已靠边，但后方开始拥堵。你应该？",
    opts:["帮助疏导后方车辆，等待交警/保险公司处理","站在行车道拍照发朋友圈","坐回车里开着双闪等就好"],
    good:[0], cost:[0,10,5],
    fb:"事故后应尽快撤离现场并配合疏导，避免拥堵扩大；因处置不当造成拥堵或二次事故记 6 分。",
    record:"第4站：靠边后协助疏导车辆，防止拥堵"
  },
  {
    km:"第5站 · 复盘与报警", text:"交警到场前，以下做法中最不应该做的是？",
    opts:["站在行车道中央疏导交通，让自己更显眼","退到护栏外（路肩）等待，向交警如实说明经过并提供行车记录仪","隐瞒真实经过，谎称对方全责"],
    good:[1], cost:[15,0,15],
    fb:"正确答案：人撤离到安全地带、如实说明经过。站在行车道中央极度危险（易遭二次碰撞）；隐瞒经过、伪造现场将承担全部责任，甚至涉嫌违法。",
    record:"第5站：撤离到安全地带并如实向交警说明经过"
  }
];
let idx=0,pts=100,answered=false,logLines=[];
const $=s=>document.querySelector(s);
function addLog(t){
  logLines.push(t);
  $('#log').innerHTML=`<b>📋 事件记录</b><br>`+logLines.map(l=>`· ${l}`).join('<br>');
  $('#log').scrollTop=$('#log').scrollHeight;
}
function render(){
  answered=false;
  const s=STEPS[idx];
  $('#pts').textContent=pts;
  $('#stage').innerHTML=`
    <div class="scene">
      <div class="km">📍 ${s.km}</div>
      <h3>${s.text}</h3>
      <div class="opts">${s.opts.map((o,i)=>`<button onclick="choose(${i})">${o}</button>`).join('')}</div>
      <div class="fb" id="fb"></div>
    </div>`;
  $('#finishBtn').style.display='none';
}
function choose(i){
  if(answered)return;answered=true;
  const s=STEPS[idx];
  const ok=s.good.includes(i);
  if(!ok)pts-=s.cost[i];
  document.querySelectorAll('.opts button').forEach((b,j)=>{
    b.disabled=true;
    if(s.good.includes(j))b.classList.add('ok');
    else if(j===i)b.classList.add('bad');
  });
  const fb=$('#fb');
  fb.style.display='block';
  fb.className='fb '+(ok?'good':'bad');
  fb.innerHTML=(ok?'✅ 正确！ ':'❌ 不当处置！ ')+s.fb;
  const rec = s.record + (ok?'（正确处置）':'（存在失误，正确做法应为：'+s.opts[s.good[0]]+'）');
  addLog(rec);
  postText(`第${idx+1}站决策：${s.text} → 选择：${s.opts[i]}（${ok?'正确':'不当'}）。`);
  const nav=document.createElement('div');
  nav.style.marginTop='12px';
  nav.innerHTML=`<button class="btn" onclick="next()">${idx+1>=STEPS.length?'查看综合评估 →':'下一步 →'}</button>`;
  document.querySelector('.scene').appendChild(nav);
}
function postText(t){
  try{window.parent.postMessage({type:"metapilot:context:text",text:t},"*");}catch(e){}
}
function submitToAI(){
  try{window.parent.postMessage({type:"metapilot:finish"},"*");}catch(e){}
  $('#finishBtn').textContent='✅ 已提交给 AI 评判，请查看组件右下角结果';
  $('#finishBtn').disabled=true;
}
function next(){
  if(idx+1>=STEPS.length){end();return;}
  idx++;render();
}
function end(){
  postText(`处置演练完成：本次处置安全分 ${pts}/100。`);
  addLog(`处置演练完成，安全分 ${pts}/100。`);
  const g=pts>=95?'A+ 处置规范':pts>=85?'A 基本规范':pts>=70?'B 有待改进':'C 需重点学习';
  const tip=pts>=95?'处置流程非常规范，牢记\"车靠边、人撤离、即报警\"。':pts>=85?'大方向正确，个别细节（警告标志距离、私了流程）再巩固。':pts>=70?'建议回第10章重学事故处理，尤其是警告标志与快处快赔流程。':'事故处理是保命技能，请务必重学第10章并重做本演练。';
  $('#stage').innerHTML=`
    <div class="end">
      <div class="grade">${g}</div>
      <div class="sub">处置分 <b style="color:#ffd200">${pts} / 100</b><br>${tip}<br><br>点击上方「✨ 结束并提交给 AI 评判」获取个性化点评。</div>
      <div style="margin-top:14px"><button class="btn" onclick="restart()">🔁 重新演练</button></div>
    </div>`;
  setTimeout(()=>{$('#finishBtn').style.display='inline-block';},300);
}
function restart(){idx=0;pts=100;answered=false;logLines=[];$('#log').innerHTML='<b>📋 事件记录</b><br>';const fb=$('#finishBtn');fb.textContent='✨ 结束并提交给 AI 评判';fb.disabled=false;fb.style.display='none';render();}
addLog('事故演练开始：轻微追尾事故（无人伤、车辆可移动）。');
render();
</script>
</body>
</html>
