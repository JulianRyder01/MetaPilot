<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>直方图与均衡化</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff;color:#1f2937}
  .wrap{padding:12px 16px}
  h2{font-size:15px;margin:0 0 4px}
  p.desc{font-size:12px;color:#6b7280;margin:0 0 10px;line-height:1.6}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  canvas{border:1px solid #e5e7eb;border-radius:8px;background:#fafafa}
  .controls{display:flex;gap:14px;margin-top:10px;font-size:12px;align-items:center}
  input[type=range]{width:140px}
  button{font-size:12px;padding:5px 14px;border-radius:6px;border:1px solid #a7f3d0;background:#ecfdf5;color:#047857;cursor:pointer}
  button.active{background:#059669;color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <h2>灰度直方图与直方图均衡化</h2>
  <p class="desc">
    直方图统计图像中每个灰度级的像素数量。<b>直方图均衡化</b>把集中在一小段灰度区间的像素分布
    拉伸到整个区间，让图像对比度显著提升。对比左右两张图与它们的直方图，观察均衡化前后灰度的重新分布。
  </p>
  <div class="row">
    <div><p style="font-size:11px;color:#6b7280;margin:0 0 4px">原图（低对比度）</p>
      <canvas id="imgA" width="240" height="240"></canvas>
      <canvas id="histA" width="240" height="90"></canvas></div>
    <div><p style="font-size:11px;color:#6b7280;margin:0 0 4px">均衡化后</p>
      <canvas id="imgB" width="240" height="240"></canvas>
      <canvas id="histB" width="240" height="90"></canvas></div>
  </div>
  <div class="controls">
    <div class="ctrl"><label>对比度（原图压缩程度）</label><input type="range" id="contrast" min="10" max="120" value="30"></div>
    <button id="eq" class="active">直方图均衡化</button>
  </div>
</div>
<script>
const S=240;
const ca=document.getElementById('imgA').getContext('2d');
const cb=document.getElementById('imgB').getContext('2d');
const ha=document.getElementById('histA').getContext('2d');
const hb=document.getElementById('histB').getContext('2d');
const imgA=document.getElementById('imgA'),imgB=document.getElementById('imgB');
const histA=document.getElementById('histA'),histB=document.getElementById('histB');
const gA=new Float32Array(S*S),gB=new Float32Array(S*S);

function buildBase(c){
  // 合成测试图：渐变 + 暗块 + 亮块，压缩到 [c, 255-c] 区间制造低对比度
  for(let y=0;y<S;y++){
    for(let x=0;x<S;x++){
      let v=(x+y)/2;                       // 渐变
      if(x>60&&x<150&&y>50&&y<130)v=40;    // 暗块
      if(x>100&&x<200&&y>140&&y<220)v=210; // 亮块
      v+=(Math.sin(x*0.8)*Math.cos(y*0.8))*6;
      v=Math.max(0,Math.min(255,v));
      const lo=c,hi=255-c;
      v=lo+v*(hi-lo)/255;
      gA[y*S+x]=v;
    }
  }
}
function histOf(src){
  const h=new Array(256).fill(0);
  for(let i=0;i<S*S;i++)h[Math.round(src[i])]++;
  return h;
}
function equalize(src){
  const h=histOf(src);
  // 累积分布
  const cdf=new Array(256);let acc=0;
  for(let i=0;i<256;i++){acc+=h[i];cdf[i]=acc;}
  const cdfmin=cdf.find(v=>v>0)||0;
  const out=new Float32Array(S*S);
  for(let i=0;i<S*S;i++){
    const g=Math.round(src[i]);
    out[i]=Math.round((cdf[g]-cdfmin)/(S*S-cdfmin)*255);
  }
  return out;
}
function drawImage(ctx,canvas,data){
  const img=ctx.createImageData(S,S);
  for(let i=0;i<S*S;i++){
    const v=Math.round(data[i]);
    img.data[i*4]=v;img.data[i*4+1]=v;img.data[i*4+2]=v;img.data[i*4+3]=255;
  }
  ctx.putImageData(img,0,0);
}
function drawHist(ctx,canvas,h,color){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const max=Math.max(...h);
  ctx.fillStyle='#e5e7eb';ctx.fillRect(0,0,canvas.width,canvas.height);
  for(let i=0;i<256;i++){
    ctx.fillStyle=color;
    const bh=h[i]/max*(canvas.height-6);
    ctx.fillRect(i*(canvas.width/256),canvas.height-bh,canvas.width/256+0.5,bh);
  }
}
function update(){
  const c=parseInt(document.getElementById('contrast').value);
  buildBase(c);
  const eq=document.getElementById('eq').classList.contains('active');
  for(let i=0;i<S*S;i++)gB[i]=eq?equalize(gA)[i]:gA[i];
  drawImage(ca,imgA,gA);drawImage(cb,imgB,gB);
  drawHist(ha,histA,histOf(gA),'#6366f1');
  drawHist(hb,histB,histOf(gB),'#059669');
}
document.getElementById('contrast').oninput=update;
document.getElementById('eq').onclick=()=>{
  document.getElementById('eq').classList.toggle('active');
  update();
};
update();
</script>
</body>
</html>
