<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>采样与混叠</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff;color:#1f2937}
  .wrap{padding:12px 16px}
  h2{font-size:15px;margin:0 0 4px}
  p.desc{font-size:12px;color:#6b7280;margin:0 0 10px;line-height:1.6}
  canvas{border:1px solid #e5e7eb;border-radius:8px;background:#fafafa;display:block}
  .controls{display:flex;flex-wrap:wrap;gap:16px;margin-top:10px;font-size:12px}
  .ctrl{display:flex;align-items:center;gap:6px}
  .ctrl label{color:#374151}
  input[type=range]{width:130px}
  .tag{font-size:11px;padding:2px 8px;border-radius:99px;background:#ede9fe;color:#6d28d9}
  .tag.alias{background:#fee2e2;color:#b91c1c}
</style>
</head>
<body>
<div class="wrap">
  <h2>采样与混叠（Nyquist 采样定理）</h2>
  <p class="desc">
    拖动"信号频率"与"采样频率"观察采样点。当采样频率低于信号频率的 2 倍（<b>奈奎斯特率</b>）时，
    重建信号出现错误的低频成分——这就是<b>混叠（aliasing）</b>。数学上：fs ≥ 2f 才能无失真重建。
  </p>
  <canvas id="cv" width="560" height="300"></canvas>
  <div class="controls">
    <div class="ctrl"><label>信号频率 f:</label><input type="range" id="freq" min="1" max="10" step="0.5" value="3"><span id="freqV"></span></div>
    <div class="ctrl"><label>采样频率 fs:</label><input type="range" id="srate" min="3" max="25" step="1" value="12"><span id="srateV"></span></div>
    <span class="tag" id="status"></span>
  </div>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
const freqEl=document.getElementById('freq'),srateEl=document.getElementById('srate');
const freqV=document.getElementById('freqV'),srateV=document.getElementById('srateV');
const statusEl=document.getElementById('status');
const N=W;
let t=0;

function sig(x,f){return Math.sin(2*Math.PI*f*x/W)+0.4*Math.sin(2*Math.PI*f*0.5*x/W);}

function draw(){
  const f=parseFloat(freqEl.value),fs=parseFloat(srateEl.value);
  freqV.textContent=f.toFixed(1)+' Hz';srateV.textContent=fs.toFixed(0)+' Hz';
  const alias=fs<2*f;
  statusEl.textContent=alias?'混叠发生：fs < 2f':'正常采样：fs ≥ 2f（奈奎斯特率）';
  statusEl.className='tag'+(alias?' alias':'');
  ctx.clearRect(0,0,W,H);
  // 网格
  ctx.strokeStyle='#eee';ctx.lineWidth=1;
  for(let y=60;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  // 原信号（连续）
  ctx.strokeStyle='#94a3b8';ctx.lineWidth=1.5;
  ctx.beginPath();
  for(let x=0;x<N;x++){const y=H/2-sig(x,f)*(H/2-30);x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
  ctx.stroke();
  // 采样点
  const step=W/fs;
  ctx.fillStyle='#6366f1';
  for(let x=0;x<W;x+=step){
    const y=H/2-sig(x,f)*(H/2-30);
    ctx.beginPath();ctx.arc(x,y,3.2,0,7);ctx.fill();
  }
  // 重建（采样点连线）
  ctx.strokeStyle='#ef4444';ctx.lineWidth=2;
  ctx.beginPath();let first=true;
  for(let x=0;x<W;x+=step){
    const y=H/2-sig(x,f)*(H/2-30);
    first?ctx.moveTo(x,y):ctx.lineTo(x,y);first=false;
  }
  ctx.stroke();
  // 标注
  ctx.fillStyle='#64748b';ctx.font='11px sans-serif';
  ctx.fillText('灰色：原信号',10,18);
  ctx.fillStyle='#6366f1';ctx.fillText('蓝点：采样点',110,18);
  ctx.fillStyle='#ef4444';ctx.fillText('红线：按采样点重建（失真时出现混叠）',210,18);
  t+=0.02;
  requestAnimationFrame(draw);
}
freqEl.oninput=draw;srateEl.oninput=draw;
draw();
</script>
</body>
</html>
