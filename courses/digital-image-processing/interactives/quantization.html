<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>灰度量化</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff;color:#1f2937}
  .wrap{padding:12px 16px}
  h2{font-size:15px;margin:0 0 4px}
  p.desc{font-size:12px;color:#6b7280;margin:0 0 10px;line-height:1.6}
  canvas{border:1px solid #e5e7eb;border-radius:8px;background:#fafafa;display:block}
  .controls{display:flex;gap:14px;margin-top:10px;font-size:12px;align-items:center}
  .ctrl{display:flex;align-items:center;gap:6px}
  input[type=range]{width:150px}
</style>
</head>
<body>
<div class="wrap">
  <h2>灰度量化：位深与伪轮廓</h2>
  <p class="desc">
    连续灰度必须量化成有限个等级。拖动"量化位数"观察：8 位（256 级）平滑自然；
    降到 2~3 位后灰度呈<b>阶梯状</b>，出现明显的<b>伪轮廓（false contouring）</b>。
    位数每减 1，灰度级减半：2^k 级。
  </p>
  <canvas id="cv" width="560" height="240"></canvas>
  <div class="controls">
    <div class="ctrl"><label>量化位数 k（灰度级 = 2^k）</label><input type="range" id="bits" min="1" max="8" step="1" value="8"><span id="bitsV"></span></div>
  </div>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
function draw(){
  const bits=parseInt(document.getElementById('bits').value);
  document.getElementById('bitsV').textContent=bits+' 位 → '+(1<<bits)+' 级';
  ctx.clearRect(0,0,W,H);
  // 渐变条（原始连续）
  const grad=ctx.createLinearGradient(20,0,W-20,0);
  for(let i=0;i<=10;i++)grad.addColorStop(i/10,`hsl(${i*12},70%,50%)`);
  ctx.fillStyle=grad;ctx.fillRect(20,30,W-40,60);
  ctx.fillStyle='#6b7280';ctx.font='11px sans-serif';
  ctx.fillText('连续渐变（参考）',20,22);
  // 量化后（用亮度斜坡）
  const levels=1<<bits;
  ctx.fillStyle='#111';
  for(let x=20;x<W-20;x++){
    const v=Math.round(((x-20)/(W-40))*levels)/levels;
    const c=Math.round(v*255);
    ctx.fillStyle=`rgb(${c},${c},${c})`;
    ctx.fillRect(x,120,1,80);
  }
  ctx.fillStyle='#6b7280';ctx.font='11px sans-serif';
  ctx.fillText('量化后的灰度阶梯（每级一个色带）',20,112);
  // 统计
  ctx.fillStyle='#1f2937';ctx.font='12px sans-serif';
  ctx.fillText('可见条带数 = '+levels+'（人眼可分辨约 30~60 级，低于此出现伪轮廓）',20,222);
}
document.getElementById('bits').oninput=draw;
draw();
</script>
</body>
</html>
