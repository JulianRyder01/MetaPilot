<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>阈值分割</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff;color:#1f2937}
  .wrap{padding:12px 16px}
  h2{font-size:15px;margin:0 0 4px}
  p.desc{font-size:12px;color:#6b7280;margin:0 0 10px;line-height:1.6}
  canvas{border:1px solid #e5e7eb;border-radius:8px;background:#fafafa;display:block}
  .controls{display:flex;gap:14px;margin-top:10px;font-size:12px;align-items:center}
  .ctrl{display:flex;align-items:center;gap:6px}
  input[type=range]{width:140px}
  button{font-size:12px;padding:4px 10px;border-radius:6px;border:1px solid #c7d2fe;background:#eef2ff;color:#4338ca;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <h2>图像分割：全局阈值</h2>
  <p class="desc">
    分割把图像分成有意义的区域。最简单的方法是<b>全局阈值</b>：灰度 &gt; T 判为前景（白），否则为背景（黑）。
    观察双峰直方图：阈值应选在两个峰之间的谷底。用<b>大津法（Otsu）</b>可自动寻找使类间方差最大的最优阈值。
  </p>
  <canvas id="cv" width="560" height="280"></canvas>
  <div class="controls">
    <div class="ctrl"><label>阈值 T</label><input type="range" id="th" min="0" max="255" value="110"><span id="thV"></span></div>
    <button id="otsu">大津法自动阈值</button>
    <span class="tag" id="info" style="font-size:11px;color:#6b7280"></span>
  </div>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=560,H=280;
const S=112;
const data=new Float32Array(S*S);
for(let y=0;y<S;y++)for(let x=0;x<S;x++){
  const dx=x-S*0.35,dy=y-S*0.45;
  let v=30+Math.sin(x*0.3)*8;
  if(dx*dx+dy*dy<1500)v=200+Math.cos(y*0.2)*10;
  if(x>S*0.62&&y>S*0.6)v=150;
  data[y*S+x]=v;
}
function histOf(){const h=new Array(256).fill(0);for(let i=0;i<S*S;i++)h[Math.round(data[i])]++;return h;}
function otsu(){
  const h=histOf(),N=S*S;
  let wB=0,sumB=0,sumAll=0;
  for(let i=0;i<256;i++)sumAll+=i*h[i];
  let best=-1,bestT=0;
  for(let t=0;t<256;t++){
    wB+=h[t];if(wB===0)continue;
    const wF=N-wB;if(wF===0)break;
    sumB+=t*h[t];
    const mB=sumB/wB,mF=(sumAll-sumB)/wF;
    const between=wB*wF*(mB-mF)*(mB-mF);
    if(between>best){best=between;bestT=t;}
  }
  return bestT;
}
function draw(){
  const T=parseInt(document.getElementById('th').value);
  document.getElementById('thV').textContent=T;
  const img=ctx.createImageData(S,S);
  for(let i=0;i<S*S;i++){
    const b=data[i]>T?255:0;
    img.data[i*4]=b;img.data[i*4+1]=b;img.data[i*4+2]=b;img.data[i*4+3]=255;
  }
  ctx.clearRect(0,0,W,H);
  ctx.putImageData(img,(W-S)/2,20);
  // 直方图 + 阈值线（底部）
  const h=histOf(),max=Math.max(...h);
  const bx=10,by=H-60,bw=W-20,bh=44;
  ctx.fillStyle='#f3f4f6';ctx.fillRect(bx,by,bw,bh);
  for(let i=0;i<256;i++){
    ctx.fillStyle='#6366f1';
    ctx.fillRect(bx+i*(bw/256),by+bh-h[i]/max*bh,1.5,h[i]/max*bh);
  }
  ctx.strokeStyle='#ef4444';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(bx+T*(bw/256),by-4);ctx.lineTo(bx+T*(bw/256),by+bh);ctx.stroke();
  ctx.fillStyle='#6b7280';ctx.font='10px sans-serif';
  ctx.fillText('直方图与阈值线（红）',bx,by-8);
}
document.getElementById('th').oninput=draw;
document.getElementById('otsu').onclick=()=>{document.getElementById('th').value=otsu();draw();};
draw();
</script>
</body>
</html>
