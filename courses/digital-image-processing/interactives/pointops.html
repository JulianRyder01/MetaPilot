<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>灰度点运算</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff;color:#1f2937}
  .wrap{padding:12px 16px}
  h2{font-size:15px;margin:0 0 4px}
  p.desc{font-size:12px;color:#6b7280;margin:0 0 10px;line-height:1.6}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  canvas{border:1px solid #e5e7eb;border-radius:8px;background:#fafafa}
  .controls{display:flex;flex-wrap:wrap;gap:16px;margin-top:10px;font-size:12px;align-items:center}
  .ctrl{display:flex;align-items:center;gap:6px}
  input[type=range]{width:130px}
  button{font-size:12px;padding:5px 12px;border-radius:6px;border:1px solid #c7d2fe;background:#eef2ff;color:#4338ca;cursor:pointer}
  button.active{background:#4338ca;color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <h2>灰度变换（点运算）</h2>
  <p class="desc">
    点运算 s = T(r) 对每个像素独立变换，不依赖邻域。线性拉伸提升对比度；
    伽马变换 s = r^γ 调节中间调亮度（γ&lt;1 变亮、γ&gt;1 变暗）；反转变换生成负片。
  </p>
  <div class="row">
    <div><p style="font-size:11px;color:#6b7280;margin:0 0 4px">原图（暗部细节被压缩）</p><canvas id="src" width="240" height="240"></canvas></div>
    <div><p style="font-size:11px;color:#6b7280;margin:0 0 4px">变换结果</p><canvas id="out" width="240" height="240"></canvas></div>
  </div>
  <div class="controls">
    <button data-m="0" class="active">线性拉伸</button>
    <button data-m="1">伽马 γ=0.45（提亮暗部）</button>
    <button data-m="2">伽马 γ=2.2（压暗）</button>
    <button data-m="3">反转（负片）</button>
    <div class="ctrl"><label>拉伸强度</label><input type="range" id="strength" min="0" max="2" step="0.05" value="1.2"></div>
  </div>
</div>
<script>
const S=240;
const cs=document.getElementById('src').getContext('2d');
const co=document.getElementById('out').getContext('2d');
const srcData=new Float32Array(S*S);
// 暗部细节丰富的测试图
for(let y=0;y<S;y++)for(let x=0;x<S;x++){
  let v=60+40*Math.sin(x*0.1)*Math.cos(y*0.1)+(x<S/2?40:0)+((x+y)%24<12?15:0);
  srcData[y*S+x]=Math.max(0,Math.min(255,v));
}
function drawImg(ctx,data){
  const img=ctx.createImageData(S,S);
  for(let i=0;i<S*S;i++){
    const v=Math.round(data[i]);
    img.data[i*4]=v;img.data[i*4+1]=v;img.data[i*4+2]=v;img.data[i*4+3]=255;
  }
  ctx.putImageData(img,0,0);
}
function transform(m,strength){
  const out=new Float32Array(S*S);
  for(let i=0;i<S*S;i++){
    let r=srcData[i]/255,v=0;
    if(m===0)v=Math.max(0,Math.min(1,(r-0.2)*strength+0.1)); // 线性拉伸
    else if(m===1)v=Math.pow(r,0.45);
    else if(m===2)v=Math.pow(r,2.2);
    else v=1-r;
    out[i]=v*255;
  }
  return out;
}
drawImg(cs,srcData);
let mode=0;
document.querySelectorAll('button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');mode=parseInt(b.dataset.m);
    update();
  };
});
function update(){
  const s=parseFloat(document.getElementById('strength').value);
  drawImg(co,transform(mode,s));
}
document.getElementById('strength').oninput=update;
update();
</script>
</body>
</html>
